
trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'
  terraformVersion: '1.15.8'

  # Configure these in Azure DevOps Pipeline Variables.
  azureServiceConnection: 'sc-azure-aiops-dev'
  backendResourceGroup: 'terraformrg'
  backendStorageAccount: 'pipeline1234556'
  backendContainer: 'tfstate'
  backendKey: 'aiops-mlops/dev.tfstate'

stages:

# 1. PYTHON TESTS
- stage: PythonTests
  displayName: Python ML Tests
  jobs:
  - job: Test
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)

    - bash: |
        set -e
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt pytest
        python -m pytest tests/ -v
      displayName: Install dependencies and run tests

# 2. NON-BLOCKING SECURITY SCANS
- stage: SecurityScan
  displayName: Security Scanning
  dependsOn: PythonTests
  condition: succeeded()
  jobs:
  - job: Scan
    steps:
    - checkout: self
      fetchDepth: 0

    - bash: |
        mkdir -p "$(Build.ArtifactStagingDirectory)/security-reports"

        # Install scanners. Scanner findings/errors must not stop this stage.
        python -m pip install semgrep checkov || true

        # Gitleaks
        if ! command -v gitleaks >/dev/null 2>&1; then
          curl -fsSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz &&
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        fi

        if [ -x /tmp/gitleaks ]; then
          /tmp/gitleaks git . --redact \
            --report-format json \
            --report-path "$(Build.ArtifactStagingDirectory)/security-reports/gitleaks.json" \
            || echo "Gitleaks findings/error; review logs."
        else
          echo "Gitleaks installation failed; scan unavailable."
        fi

        # Semgrep
        if command -v semgrep >/dev/null 2>&1; then
          semgrep scan --config p/python --config p/terraform \
            --json \
            --output "$(Build.ArtifactStagingDirectory)/security-reports/semgrep.json" \
            . || echo "Semgrep findings/error; review logs."
        else
          echo "Semgrep unavailable."
        fi

        # Checkov
        if command -v checkov >/dev/null 2>&1; then
          checkov -d environments/dev --framework terraform \
            --output json \
            --output-file-path "$(Build.ArtifactStagingDirectory)/security-reports" \
            || echo "Checkov findings/error; review logs."
        else
          echo "Checkov unavailable."
        fi

        # tfsec
        curl -fsSL \
          https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64 \
          -o /tmp/tfsec &&
        chmod +x /tmp/tfsec &&
        /tmp/tfsec environments/dev \
          --format json \
          --out "$(Build.ArtifactStagingDirectory)/security-reports/tfsec.json" \
          || echo "tfsec findings/installation error; review logs."

        exit 0
      displayName: Run security scans without blocking

    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/security-reports
        artifact: security-reports
      displayName: Publish security reports

# 3. TERRAFORM VALIDATION
- stage: TerraformValidation
  displayName: Terraform Validation
  dependsOn:
  - PythonTests
  - SecurityScan
  condition: succeeded()
  jobs:
  - job: Validate
    steps:
    - checkout: self

    - bash: |
        set -e
        VERSION="$(terraformVersion)"
        curl -fsSLo /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o /tmp/terraform.zip -d /tmp/terraform-bin
        sudo install /tmp/terraform-bin/terraform /usr/local/bin/terraform
        terraform version
      displayName: Install Terraform

    - bash: terraform fmt -check -recursive
      displayName: Check formatting

    - bash: |
        set -e
        terraform init -backend=false
        terraform validate
      workingDirectory: environments/dev
      displayName: Validate Terraform

# 4. REAL TERRAFORM PLAN
- stage: TerraformPlan
  displayName: Generate Terraform Plan
  dependsOn: TerraformValidation
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  jobs:
  - job: Plan
    steps:
    - checkout: self

    - bash: |
        set -e
        VERSION="$(terraformVersion)"
        curl -fsSLo /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o /tmp/terraform.zip -d /tmp/terraform-bin
        sudo install /tmp/terraform-bin/terraform /usr/local/bin/terraform
      displayName: Install Terraform

    - task: AzureCLI@2
      displayName: Initialize remote state and create plan
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          cd environments/dev

          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$(backendResourceGroup)" \
            -backend-config="storage_account_name=$(backendStorageAccount)" \
            -backend-config="container_name=$(backendContainer)" \
            -backend-config="key=$(backendKey)" \
            -backend-config="use_azuread_auth=true"

          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt

          mkdir -p "$(Build.ArtifactStagingDirectory)/terraform-plan"
          cp tfplan plan.txt "$(Build.ArtifactStagingDirectory)/terraform-plan/"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/terraform-plan
        artifact: terraform-plan
      displayName: Publish plan for review

# 5. MANUAL APPROVAL
- stage: ApplyApproval
  displayName: Approve Terraform Changes
  dependsOn: TerraformPlan
  condition: succeeded()
  jobs:
  - job: Approval
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: ''
        approvers: ''
        allowApproversToApproveTheirOwnRuns: false
        instructions: |
          Open the terraform-plan artifact from the TerraformPlan stage.
          Review plan.txt and confirm all proposed resource changes.
          Approve only if the plan is correct.
        onTimeout: reject

# 6. APPLY THE EXACT SAVED PLAN
- stage: TerraformApply
  displayName: Apply Approved Terraform Plan
  dependsOn: ApplyApproval
  condition: succeeded()
  jobs:
  - job: Apply
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: current
        artifactName: terraform-plan
        targetPath: $(Pipeline.Workspace)/terraform-plan
      displayName: Download approved plan

    - bash: |
        set -e
        VERSION="$(terraformVersion)"
        curl -fsSLo /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o /tmp/terraform.zip -d /tmp/terraform-bin
        sudo install /tmp/terraform-bin/terraform /usr/local/bin/terraform
      displayName: Install Terraform

    - task: AzureCLI@2
      displayName: Apply approved plan
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          cd environments/dev

          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$(backendResourceGroup)" \
            -backend-config="storage_account_name=$(backendStorageAccount)" \
            -backend-config="container_name=$(backendContainer)" \
            -backend-config="key=$(backendKey)" \
            -backend-config="use_azuread_auth=true"

          terraform apply -input=false \
            "$(Pipeline.Workspace)/terraform-plan/tfplan"

          terraform output
