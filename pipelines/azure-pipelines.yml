
trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'
  terraformVersion: '1.15.8'
  azureServiceConnection: 'sc-azure-aiops-dev'
  backendResourceGroup: 'terraformrg'
  backendStorageAccount: 'pipeline1234556'
  backendContainer: 'tfstate'
  backendKey: 'aiops-mlops/dev.tfstate'

stages:

# 1. PYTHON TESTS
- stage: PythonTests
  displayName: Python ML Tests
  jobs:
  - job: Test
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)

    - bash: |
        set -e
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt pytest
        python -m pytest tests/ -v
      displayName: Run Python tests

# 2. SECURITY SCANS - NON-BLOCKING
- stage: SecurityScan
  displayName: Security Scanning
  dependsOn: PythonTests
  condition: always()
  jobs:
  - job: Scan
    steps:
    - checkout: self
      fetchDepth: 0

    - bash: |
        mkdir -p "$(Build.ArtifactStagingDirectory)/security-reports"
        cd "$(Build.SourcesDirectory)"
        REPORT="$(Build.ArtifactStagingDirectory)/security-reports"
        set +e

        echo "=== Installing Python scanners ==="
        python -m pip install semgrep checkov bandit pip-audit
        echo "Python scanner installation exit code: $?"

        echo "=== Gitleaks ==="
        if curl -fsSL \
          https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
          -o /tmp/gitleaks.tar.gz &&
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks; then
          /tmp/gitleaks git . --redact \
            --report-format json \
            --report-path "$REPORT/gitleaks.json" \
            > "$REPORT/gitleaks.log" 2>&1
          echo "Gitleaks exit code: $?"
        else
          echo "Gitleaks installation failed."
        fi

        echo "=== Checkov ==="
        if command -v checkov >/dev/null 2>&1; then
          checkov -d environments/dev --framework terraform \
            --output json > "$REPORT/checkov.json" \
            2> "$REPORT/checkov.log"
          echo "Checkov exit code: $?"
        else
          echo "Checkov unavailable."
        fi

        echo "=== tfsec ==="
        if curl -fsSL \
          https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64 \
          -o /tmp/tfsec; then
          chmod +x /tmp/tfsec
          /tmp/tfsec environments/dev --format json \
            --out "$REPORT/tfsec.json" \
            > "$REPORT/tfsec.log" 2>&1
          echo "tfsec exit code: $?"
        else
          echo "tfsec installation failed."
        fi

        echo "=== TFLint ==="
        if curl -sSfL \
          https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh \
          -o /tmp/install_tflint.sh &&
          bash /tmp/install_tflint.sh; then
          tflint --init > "$REPORT/tflint-init.log" 2>&1
          tflint --chdir=environments/dev --format=json \
            > "$REPORT/tflint.json" 2> "$REPORT/tflint.log"
          echo "TFLint exit code: $?"
        else
          echo "TFLint installation failed."
        fi

        echo "=== Semgrep ==="
        if command -v semgrep >/dev/null 2>&1; then
          semgrep scan --config p/python --config p/terraform \
            --json --output "$REPORT/semgrep.json" . \
            > "$REPORT/semgrep.log" 2>&1
          echo "Semgrep exit code: $?"
        else
          echo "Semgrep unavailable."
        fi

        echo "=== Bandit ==="
        if command -v bandit >/dev/null 2>&1; then
          bandit -r src tests -f json -o "$REPORT/bandit.json" \
            > "$REPORT/bandit.log" 2>&1
          echo "Bandit exit code: $?"
        else
          echo "Bandit unavailable."
        fi

        echo "=== pip-audit ==="
        if command -v pip-audit >/dev/null 2>&1; then
          pip-audit -r requirements.txt -f json \
            -o "$REPORT/pip-audit.json" \
            > "$REPORT/pip-audit.log" 2>&1
          echo "pip-audit exit code: $?"
        else
          echo "pip-audit unavailable."
        fi

        echo "All scanner commands completed. Review the reports."
        exit 0
      displayName: Run security scanners without blocking

    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/security-reports
        artifact: security-reports
      displayName: Publish security reports

# 3. TERRAFORM VALIDATION
- stage: TerraformValidation
  displayName: Terraform Validation
  dependsOn:
  - PythonTests
  - SecurityScan
  condition: succeeded('PythonTests')
  jobs:
  - job: Validate
    steps:
    - checkout: self

    - bash: |
        set -e
        VERSION="$(terraformVersion)"
        curl -fsSLo /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o /tmp/terraform.zip -d /tmp/terraform-bin
        sudo install /tmp/terraform-bin/terraform /usr/local/bin/terraform
        terraform version
      displayName: Install Terraform

    - bash: terraform fmt -check -recursive
      displayName: Check Terraform formatting

    - bash: |
        set -e
        terraform init -backend=false -input=false
        terraform validate
      workingDirectory: environments/dev
      displayName: Validate Terraform

# 4. TERRAFORM PLAN
- stage: TerraformPlan
  displayName: Generate Terraform Plan
  dependsOn: TerraformValidation
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  jobs:
  - job: Plan
    steps:
    - checkout: self

    - bash: |
        set -e
        VERSION="$(terraformVersion)"
        curl -fsSLo /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o /tmp/terraform.zip -d /tmp/terraform-bin
        sudo install /tmp/terraform-bin/terraform /usr/local/bin/terraform
      displayName: Install Terraform

    - task: AzureCLI@2
      displayName: Initialize remote state and create plan
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          cd environments/dev

          test -f terraform.tfvars || {
            echo "ERROR: terraform.tfvars is missing."
            exit 1
          }

          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$(backendResourceGroup)" \
            -backend-config="storage_account_name=$(backendStorageAccount)" \
            -backend-config="container_name=$(backendContainer)" \
            -backend-config="key=$(backendKey)" \
            -backend-config="use_azuread_auth=true"

          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > plan.txt

          mkdir -p "$(Build.ArtifactStagingDirectory)/terraform-plan"
          cp tfplan plan.txt "$(Build.ArtifactStagingDirectory)/terraform-plan/"

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/terraform-plan
        artifact: terraform-plan
      displayName: Publish plan for review

# 5. MANUAL APPROVAL
- stage: ApplyApproval
  displayName: Approve Terraform Changes
  dependsOn: TerraformPlan
  condition: succeeded()
  jobs:
  - job: Approval
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: ''
        instructions: |
          Review the terraform-plan artifact from TerraformPlan.
          Read plan.txt and verify all proposed changes.
          Resume this stage only after reviewing the plan.
        onTimeout: reject

# 6. APPLY THE APPROVED SAVED PLAN
- stage: TerraformApply
  displayName: Apply Approved Terraform Plan
  dependsOn: ApplyApproval
  condition: succeeded()
  jobs:
  - job: Apply
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: current
        artifactName: terraform-plan
        targetPath: $(Pipeline.Workspace)/terraform-plan
      displayName: Download approved plan

    - bash: |
        set -e
        VERSION="$(terraformVersion)"
        curl -fsSLo /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip"
        unzip -o /tmp/terraform.zip -d /tmp/terraform-bin
        sudo install /tmp/terraform-bin/terraform /usr/local/bin/terraform
      displayName: Install Terraform

    - task: AzureCLI@2
      displayName: Apply approved Terraform plan
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          cd environments/dev

          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$(backendResourceGroup)" \
            -backend-config="storage_account_name=$(backendStorageAccount)" \
            -backend-config="container_name=$(backendContainer)" \
            -backend-config="key=$(backendKey)" \
            -backend-config="use_azuread_auth=true"

          terraform apply -input=false -lock-timeout=5m \
            "$(Pipeline.Workspace)/terraform-plan/tfplan"

          terraform output
